<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Szerencsekerék</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: white;
      user-select: none;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 2.4rem;
      letter-spacing: 3px;
      text-shadow: 0 0 24px rgba(255, 215, 0, 0.5);
    }
    .wheel-wrap {
      position: relative;
      width: 400px;
      height: 400px;
    }
    canvas {
      display: block;
      border-radius: 50%;
      box-shadow:
        0 0 0 6px rgba(255,215,0,0.5),
        0 0 40px rgba(255,215,0,0.25),
        0 8px 40px rgba(0,0,0,0.6);
    }
    .pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 34px solid #ffd700;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
      z-index: 10;
    }
    #spinBtn {
      margin-top: 2.4rem;
      padding: 16px 52px;
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 24px rgba(255,180,0,0.45);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #spinBtn:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 6px 32px rgba(255,180,0,0.65);
    }
    #spinBtn:active:not(:disabled) { transform: scale(0.97); }
    #spinBtn:disabled { opacity: 0.45; cursor: not-allowed; }
    #result {
      margin-top: 2rem;
      font-size: 2.8rem;
      font-weight: 900;
      min-height: 3.2rem;
      letter-spacing: 2px;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.5s, transform 0.5s cubic-bezier(.17,.67,.38,1.4);
    }
    #result.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <h1>Kivel szeretnél aludni ma éjjel?</h1>
  <div class="wheel-wrap">
    <canvas id="wheel" width="400" height="400"></canvas>
    <div class="pointer"></div>
  </div>
  <button id="spinBtn" onclick="spin()">Pörgetés!</button>
  <div id="result"></div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx    = canvas.getContext('2d');
    const cx = canvas.width  / 2;
    const cy = canvas.height / 2;
    const R  = cx - 8;

    const sections = [
      { label: 'Mona', color: '#e8397a', dark: '#c02060' },
      { label: 'Isti', color: '#0097b2', dark: '#006f85' },
    ];

    let currentAngle = 0;
    let spinning     = false;

    function drawWheel(angle) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const slice = (2 * Math.PI) / sections.length;

      sections.forEach((sec, i) => {
        const start = angle + i * slice - Math.PI / 2;
        const end   = start + slice;
        const mid   = (start + end) / 2;

        // Gradient fill
        const gx1 = cx + Math.cos(mid) * R * 0.3;
        const gy1 = cy + Math.sin(mid) * R * 0.3;
        const gx2 = cx + Math.cos(mid) * R;
        const gy2 = cy + Math.sin(mid) * R;
        const grad = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
        grad.addColorStop(0, sec.color);
        grad.addColorStop(1, sec.dark);

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, start, end);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Label text
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(mid);
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = 'white';
        ctx.font         = 'bold 44px Segoe UI';
        ctx.shadowColor  = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur   = 8;
        ctx.fillText(sec.label, R * 0.55, 0);
        ctx.restore();
      });

      // Outer ring accent
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(255,215,0,0.7)';
      ctx.lineWidth   = 5;
      ctx.stroke();

      // Center cap
      const capGrad = ctx.createRadialGradient(cx, cy - 4, 2, cx, cy, 26);
      capGrad.addColorStop(0, '#fff9c4');
      capGrad.addColorStop(1, '#ffd700');
      ctx.beginPath();
      ctx.arc(cx, cy, 26, 0, 2 * Math.PI);
      ctx.fillStyle   = capGrad;
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.lineWidth   = 3;
      ctx.stroke();
    }

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      document.getElementById('spinBtn').disabled = true;
      const resultEl = document.getElementById('result');
      resultEl.classList.remove('show');

      // Always land on Isti.
      // Isti is at the top (pointer position) when currentAngle ≡ π/2 (mod 2π).
      // Compute how much extra rotation is needed from the current position.
      const fullSpins  = (6 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
      const nudge      = (Math.random() * 0.5 - 0.25) * Math.PI; // ±0.25π, stays in Isti
      const desired    = Math.PI / 2 + nudge; // target angle mod 2π (center of Isti = π/2)
      const normalized = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      let   delta      = desired - normalized;
      if (delta < 0) delta += 2 * Math.PI;
      const targetAngle = currentAngle + fullSpins + delta;

      const duration  = 4200 + Math.random() * 1400;
      const startAngle = currentAngle;
      const startTime  = performance.now();

      function animate(now) {
        const t = Math.min((now - startTime) / duration, 1);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
        drawWheel(currentAngle);
        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          currentAngle = targetAngle;
          drawWheel(currentAngle);
          spinning = false;
          document.getElementById('spinBtn').disabled = false;
          resultEl.textContent = '🎉  Isti!  🎉';
          resultEl.style.color = '#00d4f5';
          resultEl.style.textShadow = '0 0 20px #00d4f5, 0 0 40px rgba(0,180,210,0.4)';
          resultEl.classList.add('show');
        }
      }

      requestAnimationFrame(animate);
    }

    drawWheel(0);
  </script>
</body>
</html>
